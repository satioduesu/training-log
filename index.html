<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>筋トレ記録</title>
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="筋トレ" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#0f1115; --card:#191c22; --card2:#20242c; --line:#2b303a;
    --fg:#eef1f5; --muted:#9aa3af; --accent:#4b9fe0; --accent2:#3fae7a;
    --danger:#e05252; --warn:#e0a52e; --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-top:var(--safe-t);}
  #app{max-width:560px;margin:0 auto;padding:0 14px 96px;}
  h1,h2,h3{margin:0;font-weight:700;}
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:14px 2px 8px;position:sticky;top:0;background:var(--bg);z-index:20;}
  .topbar h1{font-size:20px;letter-spacing:.02em;}
  .topbar .date{font-size:13px;color:var(--muted);}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}
  .btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;
    font-size:16px;font-weight:600;width:100%;transition:opacity .15s;}
  .btn:active{opacity:.7;}
  .btn.sec{background:var(--card2);color:var(--fg);border:1px solid var(--line);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);}
  .btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px;}
  .btn.danger{background:var(--danger);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin:10px 0;}
  .muted{color:var(--muted);}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .wrap{flex-wrap:wrap;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--fg);}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  input,select{font-family:inherit;font-size:16px;color:var(--fg);background:var(--card2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;}
  label{font-size:13px;color:var(--muted);display:block;margin:0 0 4px 2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  /* stepper */
  .stepper{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);
    border-radius:12px;overflow:hidden;background:var(--card2);}
  .stepper button{width:52px;font-size:24px;font-weight:700;background:var(--card2);color:var(--fg);}
  .stepper button:active{background:#2c313b;}
  .stepper .val{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;}
  .stepper .val input{border:none;background:transparent;text-align:center;font-size:22px;font-weight:700;padding:0;}
  .stepper .val .u{font-size:11px;color:var(--muted);margin-top:-2px;}
  /* bottom nav */
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(20,23,29,.96);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:30;
    padding-bottom:var(--safe-b);}
  nav .inner{max-width:560px;margin:0 auto;display:flex;}
  nav button{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-size:10.5px;font-weight:600;}
  nav button.active{color:var(--accent);}
  nav .ic{font-size:20px;line-height:1;}
  /* modal */
  .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;}
  .sheet-mask.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);
    border-top-left-radius:18px;border-top-right-radius:18px;border-top:1px solid var(--line);
    max-width:560px;margin:0 auto;max-height:88vh;display:none;flex-direction:column;
    padding-bottom:var(--safe-b);}
  .sheet.open{display:flex;}
  .sheet .hd{padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);
    display:flex;align-items:center;justify-content:space-between;}
  .sheet .bd{overflow:auto;padding:8px 14px 20px;}
  .list-item{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 4px;border-bottom:1px solid var(--line);}
  .list-item:active{background:var(--card);}
  .setline{display:flex;align-items:center;justify-content:space-between;padding:9px 6px;border-bottom:1px solid var(--line);}
  .setline:last-child{border-bottom:none;}
  .badge{font-size:11px;color:var(--muted);}
  .tag-input{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{padding:7px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);}
  .tag.on{color:#fff;border-color:transparent;}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;line-height:1.7;}
  .banner{background:linear-gradient(120deg,#243244,#1c2531);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;}
  .banner .big{font-size:22px;}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi .card{margin:0;text-align:center;}
  .kpi .n{font-size:26px;font-weight:800;}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{flex:1;padding:8px;font-size:13px;font-weight:600;color:var(--muted);}
  .seg button.on{background:var(--accent);color:#fff;}
  svg text{fill:var(--muted);font-size:10px;}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;}
  .heat i{width:100%;aspect-ratio:1;border-radius:2px;background:#222732;display:block;}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;}
  a{color:var(--accent);}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));
    background:#2b313c;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:999px;
    font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;}
  .search{position:sticky;top:0;background:var(--bg);padding:6px 0 10px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>💪 筋トレ記録</h1>
    <div class="date" id="topDate"></div>
  </div>
  <div id="view"></div>
</div>

<nav><div class="inner" id="nav"></div></nav>

<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="hd"><h3 id="sheetTitle"></h3><button class="btn sm sec" id="sheetClose">閉じる</button></div>
  <div class="bd" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   筋トレ記録 PWA  —  ローカル保存で完結、Sheets同期は任意
   データは端末(localStorage)に保存。設定で同期URLを入れるとGoogleスプレッドシートへ同期。
   ============================================================ */

/* ---------- 部位(マッスルグループ) ---------- */
const MUSCLES = [
  {key:'chest',    label:'胸',   color:'#e05252'},
  {key:'back',     label:'背中', color:'#4b9fe0'},
  {key:'shoulder', label:'肩',   color:'#e0a52e'},
  {key:'biceps',   label:'二頭', color:'#8e6fe0'},
  {key:'triceps',  label:'三頭', color:'#c95fb5'},
  {key:'legs',     label:'脚',   color:'#3fae7a'},
  {key:'abs',      label:'腹',   color:'#e0713f'},
  {key:'forearm',  label:'前腕', color:'#7a8b99'},
  {key:'glutes',   label:'臀',   color:'#d94f86'},
  {key:'cardio',   label:'有酸素',color:'#6b7280'},
  {key:'other',    label:'その他',color:'#9aa0a6'},
];
const M = {}; MUSCLES.forEach(m=>M[m.key]=m);
function muscleColor(k){ return (M[k]||M.other).color; }
function muscleLabel(k){ return (M[k]||M.other).label; }

/* ---------- 既定の種目マスタ(多め・部位タグ付き) ---------- */
const DEFAULT_EXERCISES = [
  // 胸
  ['ベンチプレス','chest'],['ダンベルベンチプレス','chest'],['インクラインベンチプレス','chest'],
  ['インクラインダンベルプレス','chest'],['チェストプレス(マシン)','chest'],['ダンベルフライ','chest'],
  ['ペックフライ(マシン)','chest'],['ケーブルクロスオーバー','chest'],['ディップス','chest'],['腕立て伏せ','chest'],
  // 背中
  ['デッドリフト','back'],['懸垂(チンニング)','back'],['ラットプルダウン','back'],['ベントオーバーロウ','back'],
  ['ワンハンドダンベルロウ','back'],['シーテッドロウ(マシン)','back'],['Tバーロウ','back'],['バックエクステンション','back'],
  // 肩
  ['バーベルショルダープレス','shoulder'],['ダンベルショルダープレス','shoulder'],['ショルダープレス(マシン)','shoulder'],
  ['サイドレイズ','shoulder'],['フロントレイズ','shoulder'],['リアレイズ','shoulder'],['アップライトロウ','shoulder'],
  // 二頭
  ['バーベルカール','biceps'],['ダンベルカール','biceps'],['インクラインダンベルカール','biceps'],
  ['ハンマーカール','biceps'],['プリーチャーカール','biceps'],['ケーブルカール','biceps'],
  // 三頭
  ['ナローベンチプレス','triceps'],['トライセップスプレスダウン','triceps'],['スカルクラッシャー','triceps'],
  ['フレンチプレス','triceps'],['キックバック','triceps'],
  // 脚
  ['スクワット','legs'],['レッグプレス','legs'],['レッグエクステンション','legs'],['レッグカール','legs'],
  ['ルーマニアンデッドリフト','legs'],['ブルガリアンスクワット','legs'],['ランジ','legs'],['カーフレイズ','legs'],
  // 臀
  ['ヒップスラスト','glutes'],['ヒップアブダクション','glutes'],
  // 腹
  ['クランチ','abs'],['レッグレイズ','abs'],['プランク','abs'],['アブローラー','abs'],['ケーブルクランチ','abs'],
  // 前腕
  ['リストカール','forearm'],['リバースリストカール','forearm'],
  // 有酸素
  ['トレッドミル','cardio'],['エアロバイク','cardio'],['ローイング','cardio'],
];

/* ---------- ストレージ ---------- */
const LS_KEY = 'kintore_v1';
let S = loadState();

function loadState(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!s){
    s = { exercises:[], sets:[], settings:{syncUrl:'',token:'',unit:'kg'}, meta:{lastPush:0,lastPull:0} };
    DEFAULT_EXERCISES.forEach(([name,muscle])=> s.exercises.push({id:uid('ex'),name,muscle}) );
  }
  s.settings = Object.assign({syncUrl:'',token:'',unit:'kg'}, s.settings||{});
  s.meta = Object.assign({lastPush:0,lastPull:0}, s.meta||{});
  s.exercises = s.exercises||[]; s.sets = s.sets||[];
  return s;
}
let saveTimer=null;
function save(opts){
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  if(!(opts&&opts.nosync) && S.settings.syncUrl){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(pushToCloud, 1500); // デバウンス同期
  }
}
function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- 日付ユーティリティ ---------- */
function todayStr(d){ d=d||new Date(); const z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtJ(s){ const d=parseDate(s); const w=['日','月','火','水','木','金','土'][d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate()+'('+w+')'; }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function weekKey(s){ // ISO週っぽく: その週の月曜の日付
  const d=parseDate(s); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return todayStr(d); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return todayStr(d); }

let CUR_DATE = todayStr();

/* ---------- 計算 ---------- */
function e1rm(w,r){ if(!w) return 0; return w*(1+r/30); } // Epley
function setsByDate(date){ return S.sets.filter(x=>x.date===date); }
function exById(id){ return S.exercises.find(e=>e.id===id); }
function sessionsDates(){ return [...new Set(S.sets.map(s=>s.date))].sort(); }
function volume(s){ return (Number(s.weight)||0)*(Number(s.reps)||0); }

/* ============================================================
   ルーティング / タブ
   ============================================================ */
const TABS = [
  {key:'log',   ic:'📝', label:'記録'},
  {key:'hist',  ic:'📅', label:'履歴'},
  {key:'stats', ic:'📊', label:'集計'},
  {key:'ex',    ic:'🏷️', label:'種目'},
  {key:'set',   ic:'⚙️', label:'設定'},
];
let TAB='log';
function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(t=>
    `<button class="${t.key===TAB?'active':''}" onclick="go('${t.key}')">
      <span class="ic">${t.ic}</span><span>${t.label}</span></button>`).join('');
}
function go(tab){ TAB=tab; render(); window.scrollTo(0,0); }
function render(){
  document.getElementById('topDate').textContent = fmtJ(todayStr())+' 現在';
  renderNav();
  const v=document.getElementById('view');
  if(TAB==='log') v.innerHTML=viewLog();
  else if(TAB==='hist') v.innerHTML=viewHist();
  else if(TAB==='stats') v.innerHTML=viewStats();
  else if(TAB==='ex') v.innerHTML=viewEx();
  else if(TAB==='set') v.innerHTML=viewSet();
  if(TAB==='stats') drawStats();
}

/* ============================================================
   記録タブ
   ============================================================ */
function viewLog(){
  const rem = reminderHtml();
  const daySets = setsByDate(CUR_DATE);
  // グループ化: exId順(登場順)
  const groups=[]; const gmap={};
  daySets.forEach(s=>{ if(!gmap[s.exId]){ gmap[s.exId]={exId:s.exId, exName:s.exName, muscle:s.muscle, sets:[]}; groups.push(gmap[s.exId]); } gmap[s.exId].sets.push(s); });
  let vol=0; daySets.forEach(s=>vol+=volume(s));
  let body = groups.map(g=>{
    const rows=g.sets.map((s,i)=>`
      <div class="setline" onclick="editSet('${s.id}')">
        <div class="row" style="gap:8px"><span class="badge">${i+1}</span>
          <b>${s.weight}</b><span class="muted">kg ×</span><b>${s.reps}</b><span class="muted">回</span></div>
        <div class="badge">e1RM ${Math.round(e1rm(s.weight,s.reps))} ›</div>
      </div>`).join('');
    return `<div class="card">
      <div class="row between" style="margin-bottom:6px">
        <div class="row" style="gap:8px"><span class="dot" style="background:${muscleColor(g.muscle)}"></span>
          <b>${g.exName}</b></div>
        <button class="btn sm sec" onclick="openSetEntry('${g.exId}')">＋セット</button>
      </div>${rows}</div>`;
  }).join('');
  if(!groups.length) body=`<div class="empty">まだ記録がありません。<br>下の「種目を追加して記録」から始めましょう。</div>`;

  return `
    ${rem}
    <div class="card row between">
      <div><div class="muted" style="font-size:12px">記録日</div>
        <b style="font-size:17px">${fmtJ(CUR_DATE)}</b></div>
      <div class="row" style="gap:6px">
        <button class="btn sm sec" onclick="shiftDate(-1)">◀</button>
        <button class="btn sm sec" onclick="pickDate()">日付</button>
        <button class="btn sm sec" onclick="shiftDate(1)">▶</button>
      </div>
    </div>
    <button class="btn" onclick="openPicker()">＋ 種目を追加して記録</button>
    ${groups.length?`<div class="row between" style="margin:12px 2px 2px"><span class="muted">この日の合計</span>
      <span><b>${groups.length}</b>種目 / <b>${daySets.length}</b>セット / ボリューム <b>${Math.round(vol).toLocaleString()}</b></span></div>`:''}
    ${body}
  `;
}
function reminderHtml(){
  const ds=sessionsDates();
  if(!ds.length) return '';
  const last=ds[ds.length-1];
  const gap=daysBetween(last, todayStr());
  if(gap<=1) return '';
  const msg = gap>=4? `${gap}日空いています。そろそろ動きましょう💪` : `前回から${gap}日。今日はやりますか？`;
  return `<div class="banner"><span class="big">${gap>=4?'🔥':'👀'}</span>
    <div><b>${msg}</b><div class="hint">前回: ${fmtJ(last)}</div></div></div>`;
}
function shiftDate(n){ CUR_DATE=addDays(CUR_DATE,n); render(); }
function pickDate(){
  openSheet('日付を選ぶ', `
    <label>記録日</label><input type="date" id="dpick" value="${CUR_DATE}" max="${todayStr()}">
    <div style="height:12px"></div>
    <button class="btn" onclick="applyDate()">この日にする</button>
    <button class="btn sec" style="margin-top:8px" onclick="CUR_DATE='${todayStr()}';closeSheet();render()">今日にもどす</button>
  `);
}
function applyDate(){ const v=document.getElementById('dpick').value; if(v){CUR_DATE=v;} closeSheet(); render(); }

/* ---- 種目ピッカー ---- */
let pickerQuery='';
function openPicker(){
  openSheet('種目をえらぶ', pickerBody());
  const inp=document.getElementById('pkSearch'); if(inp){ inp.oninput=e=>{pickerQuery=e.target.value; document.getElementById('pkList').innerHTML=pickerList();}; }
}
function pickerBody(){
  return `<div class="search"><input id="pkSearch" placeholder="種目を検索…" value="${pickerQuery}"></div>
    <div id="pkList">${pickerList()}</div>
    <button class="btn sec" style="margin-top:10px" onclick="openNewExercise(true)">＋ 新しい種目をつくる</button>`;
}
function pickerList(){
  const q=pickerQuery.trim();
  let list=S.exercises.slice();
  if(q) list=list.filter(e=>e.name.includes(q));
  // 部位順に
  const order={}; MUSCLES.forEach((m,i)=>order[m.key]=i);
  list.sort((a,b)=> (order[a.muscle]-order[b.muscle]) || a.name.localeCompare(b.name,'ja'));
  if(!list.length) return `<div class="empty">見つかりません。<br>「新しい種目をつくる」から追加できます。</div>`;
  let out=''; let cur=null;
  list.forEach(e=>{
    if(e.muscle!==cur){ cur=e.muscle; out+=`<div class="row" style="gap:6px;margin:12px 2px 2px"><span class="dot" style="background:${muscleColor(cur)}"></span><span class="muted" style="font-size:12px;font-weight:700">${muscleLabel(cur)}</span></div>`; }
    out+=`<div class="list-item" onclick="chooseExercise('${e.id}')"><span>${e.name}</span><span class="muted">＋</span></div>`;
  });
  return out;
}
function chooseExercise(exId){ closeSheet(); openSetEntry(exId); }

/* ---- セット入力 ---- */
let entry={exId:null, weight:20, reps:10};
function openSetEntry(exId){
  const ex=exById(exId); if(!ex) return;
  // 初期値: 同種目の直近セットを引き継ぐ
  const prev=lastSetOf(exId);
  entry={exId, weight: prev?prev.weight:20, reps: prev?prev.reps:10};
  const prevSession=prevSessionSets(exId, CUR_DATE);
  const prevHtml = prevSession.length? `<div class="card" style="background:var(--card2)">
      <div class="muted" style="font-size:12px;margin-bottom:6px">前回 (${fmtJ(prevSession[0].date)})</div>
      ${prevSession.map((s,i)=>`<div class="setline" style="padding:6px"><span>${i+1}セット目</span><b>${s.weight}kg × ${s.reps}回</b></div>`).join('')}
      <button class="btn sm sec" style="margin-top:8px" onclick="copyPrev('${exId}')">前回を丸ごとコピー</button>
    </div>` : `<div class="hint" style="margin:4px 2px">この種目の記録はまだありません。</div>`;
  openSheet(ex.name, `
    <div class="row" style="gap:6px;margin:2px 2px 10px"><span class="dot" style="background:${muscleColor(ex.muscle)}"></span><span class="muted">${muscleLabel(ex.muscle)}</span></div>
    <div class="grid2">
      <div><label>重量 (kg)</label>${stepper('weight',entry.weight,2.5,0)}</div>
      <div><label>回数</label>${stepper('reps',entry.reps,1,0)}</div>
    </div>
    <button class="btn" style="margin-top:12px" onclick="addSet('${exId}')">＋ このセットを記録</button>
    <div style="height:10px"></div>
    <div id="todaySets">${todaySetsMini(exId)}</div>
    ${prevHtml}
  `);
}
function stepper(field,val,step,min){
  return `<div class="stepper">
    <button onclick="bump('${field}',${-step},${min})">−</button>
    <div class="val"><input type="number" inputmode="decimal" id="in_${field}" value="${val}" onchange="setField('${field}',this.value,${min})"><span class="u">${field==='weight'?'kg':'回'}</span></div>
    <button onclick="bump('${field}',${step},${min})">＋</button></div>`;
}
function bump(f,d,min){ let v=Number(entry[f])+d; if(v<min)v=min; v=Math.round(v*100)/100; entry[f]=v; const el=document.getElementById('in_'+f); if(el)el.value=v; }
function setField(f,v,min){ let n=Number(v); if(isNaN(n))n=min; if(n<min)n=min; entry[f]=n; }
function lastSetOf(exId){ const a=S.sets.filter(s=>s.exId===exId).sort((x,y)=>y.ts-x.ts); return a[0]||null; }
function prevSessionSets(exId, beforeDate){
  const dates=[...new Set(S.sets.filter(s=>s.exId===exId && s.date<beforeDate).map(s=>s.date))].sort();
  if(!dates.length) return [];
  const d=dates[dates.length-1];
  return S.sets.filter(s=>s.exId===exId && s.date===d).sort((a,b)=>a.ts-b.ts);
}
function todaySetsMini(exId){

  if(!a.length) return '';

    ${a.map((s,i)=>`<div class="setline" style="padding:6px"><span>${i+1}セット目</span>
      <span class="row" style="gap:10px"><b>${s.weight}kg × ${s.reps}回</b>
      <button class="badge" style="color:var(--danger)" onclick="delSet('${s.id}')">削除</button></span></div>`).join('')}</div>`;
}
function addSet(exId){

function delSet(id){ S.sets=S.sets.filter(s=>s.id!==id); save(); const open=document.getElementById('sheet').classList.contains('open');

function editSet(id){

/* 部位別 週間ボリューム */
function statMuscle(){
  const wk=weekKey(todayStr());
  const cur=weekVolumeByMuscle(wk); const prev=weekVolumeByMuscle(addDays(wk,-7));
  const order=MUSCLES.filter(m=>cur[m.key]||prev[m.key]);
  let total=0; order.forEach(m=>total+=cur[m.key]||0);
  const rows=order.map(m=>{
    const c=cur[m.key]||0, p=prev[m.key]||0; const diff=c-p;
    return `<div style="margin:10px 0">
      <div class="row between" style="margin-bottom:4px"><span class="row" style="gap:6px"><span class="dot" style="background:${m.color}"></span>${m.label}</span>
        <span><b>${Math.round(c).toLocaleString()}</b> <span class="hint">${diff>=0?'▲':'▼'}${Math.abs(Math.round(diff)).toLocaleString()}</span></span></div>
      <div style="background:#222732;border-radius:6px;height:10px;overflow:hidden"><div style="height:100%;width:${total?Math.max(2,Math.round(c/maxVal(cur)*100)):0}%;background:${m.color}"></div></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="row between"><b>今週の部位別ボリューム</b><span class="hint">${fmtJ(wk)}〜</span></div>
    <div class="hint" style="margin:2px 0 6px">ボリューム = 重量 × 回数 × セット。▲▼は先週比。</div>
    ${rows||'<div class="empty">今週の記録はまだありません。</div>'}
    <div class="row between" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><span class="muted">合計</span><b>${Math.round(total).toLocaleString()}</b></div>
  </div>
  <div class="card"><b>週ごとの総ボリューム(直近8週)</b><div id="chartWeekly" style="margin-top:8px"></div></div>`;
}
function weekVolumeByMuscle(wk){
  const end=addDays(wk,7); const o={};
  S.sets.forEach(s=>{ if(s.date>=wk && s.date<end){ o[s.muscle]=(o[s.muscle]||0)+volume(s); } });
  return o;
}
function maxVal(o){ let m=0; for(const k in o) m=Math.max(m,o[k]); return m||1; }

/* 種目別 推移 */
function statExercise(){
  const done=[...new Set(S.sets.map(s=>s.exId))];
  const opts=done.map(id=>{ const e=exById(id); return {id, name:e?e.name:'(削除)'} ; })
    .sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  if(!statEx || !done.includes(statEx)) statEx=opts[0].id;
  const sel=`<label>種目</label><select id="exSel" onchange="statEx=this.value;render()">
    ${opts.map(o=>`<option value="${o.id}" ${o.id===statEx?'selected':''}>${o.name}</option>`).join('')}</select>`;
  const hist=exerciseHistory(statEx);
  const best=hist.reduce((a,h)=>Math.max(a,h.top1rm),0);
  const bestW=hist.reduce((a,h)=>Math.max(a,h.maxW),0);
  return `<div class="card">${sel}</div>
    <div class="kpi">
      <div class="card"><div class="n">${bestW}</div><div class="l">自己ベスト重量(kg)</div></div>
      <div class="card"><div class="n">${Math.round(best)}</div><div class="l">推定1RMベスト(kg)</div></div>
    </div>
    <div class="card"><b>推定1RMの推移</b><div class="hint">各日のベストセットから算出(Epley式)</div><div id="chartEx" style="margin-top:8px"></div></div>
    <div class="card"><b>セッション履歴</b>
      ${hist.slice().reverse().map(h=>`<div class="setline"><span>${fmtJ(h.date)}</span>
        <span class="row" style="gap:10px"><span class="muted">${h.sets}セット</span><b>${h.maxW}kg</b><span class="badge">e1RM ${Math.round(h.top1rm)}</span></span></div>`).join('')}
    </div>`;
}
function exerciseHistory(exId){
  const byDate={};
  S.sets.filter(s=>s.exId===exId).forEach(s=>{
    const d=s.date; if(!byDate[d]) byDate[d]={date:d,sets:0,maxW:0,top1rm:0,vol:0};
    byDate[d].sets++; byDate[d].maxW=Math.max(byDate[d].maxW,Number(s.weight)||0);
    byDate[d].top1rm=Math.max(byDate[d].top1rm,e1rm(Number(s.weight)||0,Number(s.reps)||0));
    byDate[d].vol+=volume(s);
  });
  return Object.values(byDate).sort((a,b)=>a.date<b.date?-1:1);
}

/* 頻度・継続 */
function statFreq(){
  const ds=sessionsDates();
  const wk=weekKey(todayStr());
  const thisWeek=ds.filter(d=>d>=wk).length;
  const last=ds[ds.length-1];
  const gap=last?daysBetween(last,todayStr()):'-';
  // 直近4週のセッション数
  let last4=0; for(let i=0;i<28;i++){ if(ds.includes(addDays(todayStr(),-i))) last4++; }
  // 部位別頻度(直近28日)
  const mf={}; const since=addDays(todayStr(),-27);
  const seen={};
  S.sets.forEach(s=>{ if(s.date>=since){ const k=s.muscle+'@'+s.date; if(!seen[k]){ seen[k]=1; mf[s.muscle]=(mf[s.muscle]||0)+1; } } });
  const mfRows=MUSCLES.filter(m=>mf[m.key]).sort((a,b)=>mf[b.key]-mf[a.key])
    .map(m=>`<div class="row between" style="margin:6px 0"><span class="row" style="gap:6px"><span class="dot" style="background:${m.color}"></span>${m.label}</span><b>${mf[m.key]}回/4週</b></div>`).join('');
  return `<div class="kpi">
      <div class="card"><div class="n">${thisWeek}</div><div class="l">今週のトレ回数</div></div>
      <div class="card"><div class="n">${gap}</div><div class="l">前回からの日数</div></div>
      <div class="card"><div class="n">${last4}</div><div class="l">直近4週の回数</div></div>
      <div class="card"><div class="n">${ds.length}</div><div class="l">通算トレ日数</div></div>
    </div>
    <div class="card"><b>直近12週のカレンダー</b><div class="hint">濃いほどボリューム大。左が古い→右が最新。</div>
      <div style="overflow-x:auto;margin-top:10px"><div class="heat" id="heat"></div></div></div>
    <div class="card"><b>部位別のトレ頻度(直近4週)</b>${mfRows||'<div class="hint">記録なし</div>'}</div>`;
}

/* 期間まとめ */
function statSummary(){
  const now=new Date(); const mThis=todayStr(now).slice(0,7);
  const prevD=new Date(now.getFullYear(),now.getMonth()-1,1); const mPrev=todayStr(prevD).slice(0,7);
  const A=monthAgg(mThis), B=monthAgg(mPrev);
  const grown=grownExercises(mThis,mPrev);
  const cmp=(a,b,unit)=>{ const d=a-b; const s=d>=0?'▲':'▼'; return `<span class="hint">${s}${Math.abs(Math.round(d)).toLocaleString()}${unit||''}</span>`; };
  return `<div class="card"><div class="row between"><b>${mThis.replace('-','年')}月のまとめ</b><span class="hint">先月比</span></div>
    <div class="kpi" style="margin-top:10px">
      <div class="card"><div class="n">${A.days}</div><div class="l">トレ日数 ${cmp(A.days,B.days)}</div></div>
      <div class="card"><div class="n">${A.sets}</div><div class="l">総セット ${cmp(A.sets,B.sets)}</div></div>
      <div class="card"><div class="n">${Math.round(A.vol/1000).toLocaleString()}k</div><div class="l">総ボリューム ${cmp(A.vol,B.vol)}</div></div>
      <div class="card"><div class="n">${A.exCount}</div><div class="l">種目数 ${cmp(A.exCount,B.exCount)}</div></div>
    </div></div>
    <div class="card"><b>今月ボリュームの多い部位</b>
      ${A.topMuscles.map(([k,v])=>`<div class="row between" style="margin:6px 0"><span class="row" style="gap:6px"><span class="dot" style="background:${muscleColor(k)}"></span>${muscleLabel(k)}</span><b>${Math.round(v).toLocaleString()}</b></div>`).join('')||'<div class="hint">記録なし</div>'}
    </div>
    <div class="card"><b>伸びた種目 (推定1RM 先月→今月)</b>
      ${grown.length? grown.map(g=>`<div class="row between" style="margin:6px 0"><span>${g.name}</span><span><b>${Math.round(g.prev)}→${Math.round(g.cur)}kg</b> <span class="hint" style="color:var(--accent2)">+${Math.round(g.cur-g.prev)}</span></span></div>`).join('') : '<div class="hint">先月と比較できる種目がまだありません。</div>'}
    </div>`;
}
function monthAgg(ym){
  const ss=S.sets.filter(s=>s.date.slice(0,7)===ym);
  const days=new Set(ss.map(s=>s.date)).size;
  let vol=0; ss.forEach(s=>vol+=volume(s));
  const exCount=new Set(ss.map(s=>s.exId)).size;
  const mv={}; ss.forEach(s=>mv[s.muscle]=(mv[s.muscle]||0)+volume(s));
  const topMuscles=Object.entries(mv).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return {days,sets:ss.length,vol,exCount,topMuscles};
}
function grownExercises(ymCur,ymPrev){
  function best(ym){ const o={}; S.sets.filter(s=>s.date.slice(0,7)===ym).forEach(s=>{ o[s.exId]=Math.max(o[s.exId]||0, e1rm(Number(s.weight)||0,Number(s.reps)||0)); }); return o; }
  const A=best(ymCur), B=best(ymPrev); const out=[];
  for(const id in A){ if(B[id]){ const e=exById(id); out.push({name:e?e.name:'(削除)',cur:A[id],prev:B[id],d:A[id]-B[id]}); } }
  return out.filter(g=>g.d>0).sort((a,b)=>b.d-a.d).slice(0,8);
}

/* ---------- チャート描画(SVG) ---------- */
function drawStats(){
  if(statMode==='muscle') drawWeekly();
  if(statMode==='exercise') drawExChart();
  if(statMode==='freq') drawHeat();
}
function lineChart(el, points, opt){
  opt=opt||{}; const w=el.clientWidth||320, h=opt.h||140, pad=26;
  if(points.length===0){ el.innerHTML='<div class="hint">データなし</div>'; return; }
  const xs=points.map((p,i)=>i), ys=points.map(p=>p.y);
  const minY=Math.min(...ys), maxY=Math.max(...ys); const rng=(maxY-minY)||1;
  const X=i=> pad + (points.length<=1? (w-2*pad)/2 : i/(points.length-1)*(w-2*pad));
  const Y=v=> h-pad - (v-minY)/rng*(h-2*pad);
  let path=points.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const dots=points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${opt.color||'#4b9fe0'}"/>`).join('');
  const labs=points.map((p,i)=> (points.length<=6 || i%Math.ceil(points.length/6)===0)?`<text x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle">${p.x}</text>`:'').join('');
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <text x="2" y="14">${Math.round(maxY).toLocaleString()}</text>
    <text x="2" y="${h-pad}">${Math.round(minY).toLocaleString()}</text>
    <path d="${path}" fill="none" stroke="${opt.color||'#4b9fe0'}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labs}</svg>`;
}
function barChart(el, points, opt){
  opt=opt||{}; const w=el.clientWidth||320, h=opt.h||140, pad=22;
  if(!points.length){ el.innerHTML='<div class="hint">データなし</div>'; return; }
  const maxY=Math.max(...points.map(p=>p.y))||1; const bw=(w-2*pad)/points.length*0.6;
  const gap=(w-2*pad)/points.length;
  const bars=points.map((p,i)=>{ const x=pad+i*gap+ (gap-bw)/2; const bh=(p.y/maxY)*(h-2*pad); const y=h-pad-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}" rx="3" fill="${opt.color||'#3fae7a'}"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${h-6}" text-anchor="middle">${p.x}</text>`; }).join('');
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><text x="2" y="14">${Math.round(maxY).toLocaleString()}</text>${bars}</svg>`;
}
function drawWeekly(){
  const el=document.getElementById('chartWeekly'); if(!el) return;
  const wk=weekKey(todayStr()); const pts=[];
  for(let i=7;i>=0;i--){ const w=addDays(wk,-7*i); const o=weekVolumeByMuscle(w); let v=0; for(const k in o)v+=o[k];
    pts.push({x:fmtJ(w).slice(0,fmtJ(w).indexOf('(')), y:Math.round(v)}); }
  barChart(el, pts, {color:'#4b9fe0',h:150});
}
function drawExChart(){
  const el=document.getElementById('chartEx'); if(!el||!statEx) return;
  const hist=exerciseHistory(statEx);
  lineChart(el, hist.map(h=>({x:fmtJ(h.date).replace(/\(.\)/,''), y:Math.round(h.top1rm)})), {color:'#e0a52e',h:150});
}
function drawHeat(){
  const el=document.getElementById('heat'); if(!el) return;
  const weeks=12; const start=weekKey(addDays(todayStr(),-7*(weeks-1)));
  const volByDate={}; S.sets.forEach(s=>volByDate[s.date]=(volByDate[s.date]||0)+volume(s));
  const maxV=Math.max(1,...Object.values(volByDate));
  let html='';
  for(let wcol=0; wcol<weeks; wcol++){
    for(let drow=0; drow<7; drow++){
      const d=addDays(start, wcol*7+drow);
      const v=volByDate[d]||0; let bg='#222732';
      if(v>0){ const t=Math.min(1,v/maxV); const a=0.25+0.75*t; bg=`rgba(75,159,224,${a.toFixed(2)})`; }
      const future = d>todayStr();
      html+=`<i title="${fmtJ(d)} ${Math.round(v).toLocaleString()}" style="background:${future?'transparent':bg}"></i>`;
    }
  }
  el.style.width=(weeks*13)+'px'; el.innerHTML=html;
}

function saveSync(){ S.settings.syncUrl=(document.getElementById('syncUrl').value||'').trim();
  S.settings.token=(document.getElementById('syncToken').value||'').trim(); save({nosync:true}); toast('保存しました'); render(); }

/* ---------- バックアップ ---------- */
function download(name, text, type){
  const blob=new Blob([text],{type:type||'text/plain'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportJSON(){ download('kintore_backup_'+todayStr()+'.json', JSON.stringify(S), 'application/json'); }
function exportCSV(){
  const head=['date','muscle','exercise','weight_kg','reps','volume','e1rm'];
  const rows=S.sets.slice().sort((a,b)=>a.date<b.date?-1:(a.ts-b.ts)).map(s=>
    [s.date, muscleLabel(s.muscle), '"'+(s.exName||'').replace(/"/g,'""')+'"', s.weight, s.reps, volume(s), Math.round(e1rm(s.weight,s.reps))].join(','));
  download('kintore_'+todayStr()+'.csv', '﻿'+head.join(',')+'\n'+rows.join('\n'), 'text/csv');
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!confirm('現在のデータを、読み込んだ内容で置き換えます。よろしいですか？')) return;
    S.exercises=d.exercises||S.exercises; S.sets=d.sets||[]; S.settings=Object.assign(S.settings,d.settings||{});
    save({nosync:true}); render(); toast('読み込みました');
  }catch(e){ toast('読み込みに失敗'); } };
  r.readAsText(f);
}
function resetAll(){ if(!confirm('すべての記録と種目を消去します。元に戻せません。よろしいですか？')) return;
  localStorage.removeItem(LS_KEY); S=loadState(); render(); toast('消去しました'); }

/* ============================================================
   クラウド同期 (Google Apps Script)
   push: POST(no-cors, text/plain) 書き込み専用
   pull: JSONP  で読み取り
   ============================================================ */
function pushToCloud(manual){
  const url=S.settings.syncUrl; if(!url){ if(manual)toast('同期URLが未設定です'); return; }
  const payload={token:S.settings.token, exercises:S.exercises, sets:S.sets, savedAt:Date.now()};
  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(()=>{ S.meta.lastPush=Date.now(); save({nosync:true}); if(manual)toast('スプレッドシートへ送信しました'); if(manual)render(); })
    .catch(()=>{ if(manual)toast('送信に失敗しました'); });
}
let jsonpCb=0;
function pullFromCloud(){
  const url=S.settings.syncUrl; if(!url){ toast('同期URLが未設定です'); return; }
  if(!confirm('クラウドの内容で、この端末のデータを置き換えます。よろしいですか？')) return;
  const cb='__ktjsonp'+(++jsonpCb); const sep=url.includes('?')?'&':'?';
  const tmr=setTimeout(()=>{ cleanup(); toast('取得に失敗しました'); }, 12000);
  function cleanup(){ delete window[cb]; const sc=document.getElementById(cb); if(sc)sc.remove(); }
  window[cb]=function(data){ clearTimeout(tmr); cleanup();
    if(!data || data.error){ toast('取得に失敗: '+((data&&data.error)||'')); return; }
    S.exercises=data.exercises&&data.exercises.length?data.exercises:S.exercises;
    S.sets=data.sets||[]; S.meta.lastPull=Date.now(); save({nosync:true}); render(); toast('クラウドから復元しました'); };
  const sc=document.createElement('script'); sc.id=cb; sc.onerror=()=>{clearTimeout(tmr);cleanup();toast('取得に失敗しました');};
  sc.src=url+sep+'callback='+cb+'&token='+encodeURIComponent(S.settings.token)+'&_='+Date.now();
  document.body.appendChild(sc);
}

let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }
